<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iris Predictor</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; }
      label { display:block; margin-top:0.5rem }
      input { width: 100%; padding: 8px; }
      button { margin-top: 1rem; padding: 10px 16px; }
      #result { margin-top: 1rem; font-weight: bold }
    </style>
  </head>
  <body>
    <h1>Iris Flower Predictor</h1>
    <form id="predict-form">
      <label>Sepal Length <input name="sepal_length" type="number" step="any" value="5.1"></label>
      <label>Sepal Width <input name="sepal_width" type="number" step="any" value="3.5"></label>
      <label>Petal Length <input name="petal_length" type="number" step="any" value="1.4"></label>
      <label>Petal Width <input name="petal_width" type="number" step="any" value="0.2"></label>
      <button type="submit">Predict</button>
    </form>
    <div id="result"></div>

    <script>
      const form = document.getElementById('predict-form');
      const result = document.getElementById('result');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        const resp = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (resp.ok) {
          result.textContent = `🌸 Predicted: ${data.name} (class ${data.prediction})`;
        } else {
          result.textContent = `Error: ${data.error || 'unknown'}`;
        }
      });
    </script>
  </body>
</html>
